  const cmpRoll = (a, b) => (/^\d+$/.test(a) && /^\d+$/.test(b)) ? (a.length - b.length || (a < b ? -1 : a > b ? 1 : 0)) : String(a).localeCompare(String(b), undefined, {numeric: true});
  const lbl = (si, di) => D.s[si] + '/' + D.d[di];
  // index: roll -> entries
  const idx = new Map();
  D.e.forEach(x => { const k = String(x[0]).toLowerCase(); if (!idx.has(k)) idx.set(k, []); idx.get(k).push(x); });
  const cellOf = (ri, no) => D.r[ri].c.find(c => c[0] === no);
  const IRd = D.ir && D.o.irr !== false ? D.ir : null;
  const idxI = new Map();
  if (IRd) IRd.e.forEach(x => { const k = String(x[0]).toLowerCase(); if (!idxI.has(k)) idxI.set(k, []); idxI.get(k).push(x); });
  const subName = (k, si) => { const s = IRd.days[k].subs[si]; return [s[0], s[1]].filter(Boolean).join(' - '); };

  document.getElementById('t').textContent = D.title;
  document.getElementById('inst').textContent = D.inst || '';
  document.getElementById('foot').textContent = 'সর্বশেষ হালনাগাদ: ' + D.when + ' • শুধুমাত্র দেখার জন্য (Read-only)';

  const TABS = [['find', '🔍 সিট খুঁজুন']];
  if (D.o.notice && D.e.length) TABS.push(['notice', '📋 নোটিশ বোর্ড তালিকা']);
  if (IRd && IRd.days.length) TABS.push(['irr', '📅 অনিয়মিত তালিকা']);
  if (D.o.plans) TABS.push(['plans', '🪑 রুমের সিট প্ল্যান']);
  if (D.o.pdf) TABS.push(['pdf', '📄 PDF']);
  let tab = 'find';
  const nav = document.getElementById('nav'), main = document.getElementById('main');
  function renderNav() {
    nav.replaceChildren(...(TABS.length > 1 ? TABS.map(([k, t]) => h('button', {class: tab === k ? 'on' : '', text: t, onclick: () => { tab = k; render(); }})) : []));
  }
  function render() { renderNav(); main.replaceChildren(VIEWS[tab]()); }

  function roomMap(ri, highlightNo) {
    const R = D.r[ri];
    const g = h('div', {class: 'map', style: `grid-template-columns:repeat(${R.cols},1fr)`});
    R.c.forEach(c => {
      const [no, r, col, color, off] = c;
      g.appendChild(h('div', {class: (off ? 'off' : color) + (no === highlightNo ? ' me' : ''), style: `grid-row:${r + 1};grid-column:${col + 1}`, text: no === highlightNo ? '★ ' + no : (off ? '✕' : no)}));
    });
    return h('div', null, h('div', {class: 'front', text: '▲ সামনে — বোর্ড ▲'}), g);
  }

  const VIEWS = {
    find() {
      const inp = h('input', {type: 'text', inputmode: 'numeric', autocomplete: 'off', placeholder: 'আপনার রোল নম্বর লিখুন', maxlength: '20', 'aria-label': 'রোল নম্বর'});
      const out = h('div', {class: 'res'});
      const go = () => {
        const q = toEn(inp.value).replace(/\s+/g, '').toLowerCase();
        out.replaceChildren();
        if (!q) return;
        const hits = idx.get(q) || [], ih = idxI.get(q) || [];
        if (!hits.length && !ih.length) { out.appendChild(h('div', {class: 'nf', text: '❌ এই রোল নম্বর তালিকায় পাওয়া যায়নি। সঠিক রোল নম্বর দিয়ে আবার চেষ্টা করুন।'})); return; }
        hits.forEach(x => {
          const [roll, si, di, ri, no] = x;
          const c = cellOf(ri, no);
          out.appendChild(h('div', {class: 'card', style: 'border:2px solid #2e7d32'},
            h('div', {style: 'font-size:17px;margin-bottom:10px'}, 'রোল: ', h('b', {text: roll}), '  •  ', h('b', {text: lbl(si, di)})),
            h('div', {class: 'big'},
              h('div', {class: 'room'}, h('div', {class: 'k', text: 'রুম নং'}), h('div', {class: 'v', text: D.r[ri].no})),
              h('div', {class: 'seat'}, h('div', {class: 'k', text: 'সিট নং'}), h('div', {class: 'v', text: no}))),
            c ? h('div', {class: 'pos'}, '📍 বোর্ডের দিকে মুখ করে ', h('b', {text: 'বাম দিক থেকে ' + bn(c[2] + 1) + ' নং কলাম'}), ', ', h('b', {text: 'সামনে থেকে ' + bn(c[1] + 1) + ' নং সারি'}), '।') : null,
            D.o.map && c ? roomMap(ri, no) : null));
        });
        if (ih.length) {
          const anySeat = ih.some(x => x[5]);
          const rows = ih.slice().sort((a, b) => a[1] - b[1]).map(x => {
            const day = IRd.days[x[1]];
            return h('tr', null, h('td', null, h('b', {text: day.date}), day.shift ? h('div', {class: 'small', text: day.shift}) : null),
              h('td', {text: subName(x[1], x[2])}), h('td', {class: 'r', text: x[4]}), anySeat ? h('td', {class: 's', text: x[5] ? x[5] : '—'}) : null);
          });
          out.appendChild(h('div', {class: 'card irc'},
            h('h4', {text: '📅 অনিয়মিত পরীক্ষার সূচি — রোল: ' + ih[0][0] + ' (' + ih[0][3] + ')'}),
            h('div', {class: 'tw'}, h('table', {class: 'irt'}, h('thead', null, h('tr', null, ...(anySeat ? ['তারিখ', 'বিষয়', 'রুম নং', 'সিট নং'] : ['তারিখ', 'বিষয়', 'রুম নং']).map(t => h('th', {text: t})))), h('tbody', null, ...rows))),
            h('div', {class: 'hint', style: 'margin-top:6px', text: anySeat ? 'সিট নং "—" থাকলে রুমে গিয়ে কক্ষ পরিদর্শকের নির্দেশমতো বসুন।' : 'নির্ধারিত রুমে গিয়ে কক্ষ পরিদর্শকের নির্দেশমতো বসুন।'})));
        }
      };
      inp.addEventListener('keydown', e => { if (e.key === 'Enter') go(); });
      const box = h('div', null);
      if (D.msg) box.appendChild(h('div', {class: 'msg', text: D.msg}));
      box.appendChild(h('div', {class: 'card'},
        h('div', {style: 'font-weight:bold;font-size:17px;margin-bottom:8px', text: 'আপনার পরীক্ষার রুম ও সিট নম্বর জানুন'}),
        h('div', {class: 'search'}, inp, h('button', {text: 'খুঁজুন', onclick: go})),
        h('div', {class: 'hint', style: 'margin-top:6px', text: 'সম্পূর্ণ রোল নম্বর লিখে "খুঁজুন" চাপুন (বাংলা বা ইংরেজি সংখ্যা দুটোই চলবে)।'}),
        out));
      setTimeout(() => inp.focus(), 50);
      return box;
    },
    notice() {
      const groups = new Map(); // ri -> si -> di -> rolls
      D.e.forEach(([roll, si, di, ri]) => {
        if (!groups.has(ri)) groups.set(ri, new Map());
        const k = si + ':' + di, m = groups.get(ri);
        if (!m.has(k)) m.set(k, {si, di, rolls: []});
        m.get(k).rolls.push(String(roll));
      });
      const tb = h('table', null, h('thead', null, h('tr', null, ...['রুম নং', 'সেমিস্টার/বিভাগ', 'রোল (প্রথম --- শেষ)', 'সংখ্যা', 'রুমে মোট'].map(t => h('th', {text: t})))));
      const body = h('tbody'); tb.appendChild(body);
      let grand = 0;
      [...groups.keys()].sort((a, b) => a - b).forEach(ri => {
        const items = [...groups.get(ri).values()].sort((a, b) => a.si - b.si || a.di - b.di);
        const tot = items.reduce((s, x) => s + x.rolls.length, 0); grand += tot;
        items.forEach((x, k) => {
          x.rolls.sort(cmpRoll);
          const tr = h('tr');
          if (k === 0) tr.appendChild(h('td', {class: 'rm', rowspan: items.length, text: D.r[ri].no}));
          tr.appendChild(h('td', {text: lbl(x.si, x.di)}));
          tr.appendChild(h('td', {style: 'text-align:left', text: x.rolls[0] + ' --- ' + x.rolls[x.rolls.length - 1]}));
          tr.appendChild(h('td', {text: x.rolls.length}));
          if (k === 0) tr.appendChild(h('td', {rowspan: items.length, style: 'font-weight:900', text: tot}));
          body.appendChild(tr);
        });
      });
      body.appendChild(h('tr', {class: 'gt'}, h('td', {colspan: 3, style: 'text-align:right', text: 'সর্বমোট ছাত্র সংখ্যা:'}), h('td', {colspan: 2, text: grand})));
      return h('div', {class: 'card'}, h('h3', {style: 'margin-top:0', text: 'রুমভিত্তিক রোল তালিকা'}), h('div', {class: 'tw'}, tb));
    },
    irr() {
      const sel = h('select', null, ...IRd.days.map((d, k) => h('option', {value: k, text: d.date + (d.shift ? ' — ' + d.shift : '')})));
      const out = h('div');
      const draw = () => {
        const k = +sel.value, day = IRd.days[k];
        let tr = 0, ti = 0;
        const sumRows = day.subs.map(s => { tr += +s[2] || 0; ti += s[3]; return h('tr', null, h('td', {text: s[0]}), h('td', {text: s[1]}), h('td', null, String(s[2] || '—'), s[4] ? h('div', {class: 'small', text: '(' + s[4] + ')'}) : null), h('td', {text: s[3]}), h('td', {style: 'font-weight:900', text: (+s[2] || 0) + s[3]})); });
        const groups = new Map();
        IRd.e.filter(x => x[1] === k).forEach(x => { const key = x[4]; if (!groups.has(key)) groups.set(key, new Map()); const g = groups.get(key), kk = x[3] + ':' + x[2]; if (!g.has(kk)) g.set(kk, {lab: x[3], si: x[2], items: []}); g.get(kk).items.push(x); });
        const body = h('tbody');
        let tot = 0;
        groups.forEach((g, room) => {
          const items = [...g.values()];
          const rt = items.reduce((a, x) => a + x.items.length, 0); tot += rt;
          items.forEach((x, i) => {
            x.items.sort((a, b) => cmpRoll(String(a[0]), String(b[0])));
            const t = h('tr');
            if (i === 0) t.appendChild(h('td', {class: 'rm', rowspan: items.length, text: room}));
            t.appendChild(h('td', {text: x.lab}));
            t.appendChild(h('td', {text: subName(k, x.si)}));
            t.appendChild(h('td', {style: 'text-align:left', text: x.items.map(e => e[0] + (e[5] ? ' (সিট ' + e[5] + ')' : '')).join(', ')}));
            t.appendChild(h('td', {text: x.items.length}));
            if (i === 0) t.appendChild(h('td', {rowspan: items.length, style: 'font-weight:900', text: rt}));
            body.appendChild(t);
          });
        });
        body.appendChild(h('tr', {class: 'gt'}, h('td', {colspan: 4, style: 'text-align:right', text: 'মোট অনিয়মিত পরীক্ষার্থী:'}), h('td', {colspan: 2, text: tot})));
        out.replaceChildren(
          h('h4', {style: 'margin:12px 0 6px', text: 'বিষয়ভিত্তিক পরীক্ষার্থী সংখ্যা'}),
          h('div', {class: 'tw'}, h('table', null, h('thead', null, h('tr', null, ...['বিষয় কোড', 'বিষয়ের নাম', 'নিয়মিত', 'অনিয়মিত', 'মোট'].map(t => h('th', {text: t})))),
            h('tbody', null, ...sumRows, h('tr', {class: 'gt'}, h('td', {colspan: 2, style: 'text-align:right', text: 'সর্বমোট:'}), h('td', {text: tr}), h('td', {text: ti}), h('td', {text: tr + ti}))))),
          h('h4', {style: 'margin:14px 0 6px', text: 'রুমভিত্তিক অনিয়মিত পরীক্ষার্থী'}),
          h('div', {class: 'tw'}, h('table', null, h('thead', null, h('tr', null, ...['রুম নং', 'সেম./বিভাগ', 'বিষয়', 'রোল', 'সংখ্যা', 'রুমে মোট'].map(t => h('th', {text: t})))), body)));
      };
      sel.addEventListener('change', draw); draw();
      return h('div', {class: 'card'}, h('div', null, 'তারিখ বাছাই করুন: ', sel), out);
    },
    plans() {
      const sel = h('select', null, ...D.r.map((R, i) => h('option', {value: i, text: 'রুম ' + R.no})));
      const out = h('div', {class: 'tw'});
      const map = new Map(); // ri:no -> [si] = entry
      D.e.forEach(x => { const k = x[3] + ':' + x[4]; if (!map.has(k)) map.set(k, []); map.get(k)[x[1]] = x; });
      const draw = () => {
        const ri = +sel.value, R = D.r[ri];
        const g = h('div', {class: 'pg', style: `grid-template-columns:repeat(${R.cols},1fr)`});
        R.c.forEach(([no, r, c, color, off]) => {
          const pos = `grid-row:${r + 1};grid-column:${c + 1}`;
          if (off) { g.appendChild(h('div', {class: 'blk', style: pos + ';border-style:dashed;text-align:center;color:#777', text: 'Seat ' + no + ' ✕'})); return; }
          const st = map.get(ri + ':' + no) || [];
          g.appendChild(h('div', {class: 'blk ' + color, style: pos}, h('div', {class: 'bh', text: 'Seat No: ' + String(no).padStart(2, '0')}),
            ...D.s.map((s, si) => { const x = st[si]; return h('div', {class: 'ln'}, h('span', {text: x ? lbl(si, x[2]) : s + '/—'}), h('b', {text: x ? x[0] : '—'})); })));
        });
        out.replaceChildren(h('div', {class: 'front', text: '▲ সামনে — বোর্ড ▲'}), g);
      };
      sel.addEventListener('change', draw); draw();
      return h('div', {class: 'card'}, h('div', {style: 'margin-bottom:8px'}, 'রুম বাছাই করুন: ', sel), out);
    },
    pdf() {
      return h('div', {class: 'card', style: 'text-align:center'},
        h('p', {text: 'সব রুমের সিট প্ল্যান PDF আকারে দেখুন বা ডাউনলোড করুন।'}),
        h('a', {class: 'pdfbtn', href: encodeURI(D.o.pdfName), target: '_blank', rel: 'noopener noreferrer', text: '📄 সিট প্ল্যান PDF খুলুন'}));
    }
  };
  render();
})();
</script>
</body>
</html>
